# Bradford Bulls 2025/26 jersey front-panel sponsor layout
# Verified against: KIT/Home Kit.jpg, KIT/Away Kit.jpg, KIT/Kit Regulations 2025 SPONSORS SIZINGS.pdf
# UV positions calibrated via bac4_dot_test.py diagnostic render (cam_seed=42)
#
# Coordinate system for rugby_jersey_-_visual_animation.glb:
#   U: normal (0=left, 1=right in render)
#   V: INVERTED (high V = bottom of jersey in render)
#   PIL pixel: cx_px = U * TEX_SIZE, cy_px = (1 - V) * TEX_SIZE
#
# Calibrated reference points (from dot-test grid render):
#   Row 1 (V=0.535) = top of white/chest area  (near collar / V-pattern boundary)
#   Row 2 (V=0.622) = mid-chest                (secondary sponsor row)
#   Row 3 (V=0.700) = lower chest / abdomen    (main large sponsor — 300 sq cm slot)
#   U=0.200 = left of panel, U=0.250 = center, U=0.295 = right of panel
#
# Logo file choices per kit:
#   Romantica:
#     HOME  → romantica_home.jpg       (black text on light bg, generated from FINAL WHITE by inversion)
#     AWAY  → "Romantica Beds - Logo FINAL WHITE.jpg"  (white text on black bg, matches black jersey)
#   MNA logos appear on the black/yellow V-pattern area near the collar (small patches, ~60 sq cm)
#   TopNotch / Floor Tonic occupy the large 300 sq cm main sponsor slot on the white/black chest

home:
  jersey_color: [238, 238, 238]   # off-white base (home kit)
  slots:
    # ── Main sponsor (lower chest, 300 sq cm) ──────────────────────────────────
    - brand: topnotch
      logo_file: "13 - Top Notch Logo.png"
      uv_cx: 0.250   # center of front panel
      uv_cy: 0.700   # lower chest (calibrated Row 3)
      uv_w:  0.145   # ~300 sq cm slot — widest logo on kit
      jitter: true

    # ── Secondary sponsor (mid-left chest, ~60 sq cm) ─────────────────────────
    - brand: romantica
      logo_file: "romantica_home.jpg"   # generated: black text + red rose on light bg
      uv_cx: 0.207   # left of center
      uv_cy: 0.622   # mid-chest (calibrated Row 2); V=0.600-0.650 zone = 194 verts → good coverage
      uv_w:  0.075
      jitter: true

    # ── Small collar-area patches (V-pattern boundary, ~50-60 sq cm each) ─────
    - brand: mna_cladding
      logo_file: "10 - MNA Cladding.png"
      uv_cx: 0.207   # left side of panel (matches kit: MNA Cladding is left of MNA Support)
      uv_cy: 0.532   # top of chest area (calibrated Row 1)
      uv_w:  0.050
      jitter: false

    - brand: mna_support
      logo_file: "11 - MNA Support Services.png"
      uv_cx: 0.281   # right of MNA Cladding (kit shows them side-by-side near collar)
      uv_cy: 0.532
      uv_w:  0.050
      jitter: false

away:
  jersey_color: [28, 28, 28]     # near-black base (away kit)
  slots:
    # ── Main sponsor (lower chest, 300 sq cm) ──────────────────────────────────
    - brand: floor_tonic
      logo_file: "Floor tonic Logo.jpg"
      uv_cx: 0.250   # center
      uv_cy: 0.700   # lower chest (calibrated Row 3)
      uv_w:  0.145
      jitter: true

    # ── Secondary sponsor (mid-left chest, ~60 sq cm) ─────────────────────────
    - brand: romantica
      logo_file: "Romantica Beds - Logo FINAL WHITE.jpg"   # white text on black bg — correct for black jersey
      uv_cx: 0.207
      uv_cy: 0.622   # aligned with home kit (both at Row 2 denser vertex zone)
      uv_w:  0.075
      jitter: true

    # ── Small collar-area patches ──────────────────────────────────────────────
    - brand: mna_cladding
      logo_file: "10 - MNA Cladding.png"
      uv_cx: 0.207
      uv_cy: 0.532
      uv_w:  0.050
      jitter: false

    - brand: mna_support
      logo_file: "11 - MNA Support Services.png"
      uv_cx: 0.281
      uv_cy: 0.532
      uv_w:  0.050
      jitter: false

